      url: https://www.cl.cam.ac.uk/~mj201
    publication_type: conference
    featured_home: true
    tldr: >-
      We show how, under distribution shifts, concept-based interventions may fail to improve
      model performance due to concept leakage. To solve this, we introduce
      a representation factorisation that prevents this effect, leading to more robust
      and reliable concept-based models.

