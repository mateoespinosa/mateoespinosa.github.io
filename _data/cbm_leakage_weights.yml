# Data file for the concept-to-class bipartite weight graphs in the
# "In Defense of Information Leakage" post.
#
# SCHEMA
# ------
# models[]                – one entry per model to display (side by side)
#   label                 – display name shown above the graph
#   color                 – hex accent colour for the model title
#   concepts[]            – named concept node labels (left side, top group)
#   outputs[]             – output class labels (right side)
#   residual_neurons      – number of unsupervised residual neurons (0 = none)
#   max_shown_residuals   – when residual_neurons > 2 × max_shown_residuals,
#                           show only the first and last max_shown_residuals
#                           neurons with a "⋮ (N hidden)" marker in between
#   weights               – 2-D array, shape [(len(concepts) + residual_neurons)
#                           × len(outputs)]
#                           rows 0..len(concepts)-1        → named concept weights
#                           rows len(concepts)..end        → residual neuron weights
#
# NOTES
# -----
# • Replace with real weights from your trained models.
# • Positive weights render in blue, negative in red.
#   Opacity and thickness scale with |weight|.
# • Hovering a node highlights all its edges; clicking locks the highlight
#   and shows the top-5 most important edges ranked by |weight|.

