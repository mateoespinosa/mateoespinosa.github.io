<!--
  Optional dark theme, off by default. Runs before first paint so a viewer who
  has opted in never sees a flash of the light theme. No prefers-color-scheme
  check: the OS setting does not switch the site on its own.
-->
<script>
  (function () {
    try {
      var choice = localStorage.getItem('hbt-theme');
      if (choice === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
