  - title: "Don't Lose Focus: Activation Steering via Key-Orthogonal Projections"
    url: https://arxiv.org/abs/2605.06342
    venue: Neural Information Processing Systems (NeurIPS), 2026. Also at Mechanistic Interpretability Workshop in ICML 2026.
    honor: "Spotlight"
    venue_short: NeurIPS
    month: 12 # sorts within the year; never displayed
    year: 2026
    venue_display: "NeurIPS 2026"
    main_tag: LLM Steering
    tags:
    - LLM Steering
    - Steering
    - Activation Steering
    - Key-Orthogonal Projections
    - Mechanistic Interpretability
    - Interpretability
    - LLM Interpretability
    - Control
    image: "/assets/images/thumbnails/skop.png"
    image_alt: skop
    image_side: right
    links:
    - label: Paper
      url: https://arxiv.org/abs/2605.06342
      kind: paper
    - label: Code
      url: https://github.com/clarenceluo78/skop-steering
      kind: code
    - label: Poster
      url: https://mechinterpworkshop.com/poster-pdfs/163.pdf
      kind: poster
    authors:
    - name: Haoyan Luo
      url: https://clarenceluo78.github.io/
    - name: Mateo Espinosa Zarlenga
      me: true
    - name: Mateja Jamnik
      url: https://www.cl.cam.ac.uk/~mj201
    publication_type: workshop
    tldr: >-
      Steering an LLM drags its attention off task-relevant tokens it needs, affecting its performance on long horizon tasks. SKOP steers an LLM
      while maintaining its attention patterns on a set of key task-relevant tokens.

  - title: "In Defense of Information Leakage in Concept-based Models"
    url: https://arxiv.org/abs/2606.10669
    venue: International Conference on Machine Learning (ICML), 2026
    venue_short: ICML
    month: 7 # sorts within the year; never displayed
    venue_display: "ICML 2026"
    year: 2026
    note: "Position paper"
    main_tag: Concept Representation Learning
    tags:
    - Interpretability Theory
    - Position Paper
    - Concept Representation Learning
    - Concept-based Models
    - Explainable AI
    - Explainability
    image: "/assets/images/thumbnails/leakage.png"
    image_alt: Representation of leakage
    image_side: left
    links:
    - label: Paper
      url: https://arxiv.org/abs/2606.10669
      kind: paper
    - label: Code
      url: https://github.com/mateoespinosa/cem
      kind: code
    - label: Proceedings
      url: https://proceedings.mlr.press/v306/espinosa-zarlenga26a.html
      kind: proceedings
    authors:
    - name: Mateo Espinosa Zarlenga
      me: true
    publication_type: conference
    featured_home: false
    tldr: >-
      Leakage in concept representations is usually seen as a bug. In this paper I argue that
      well-conditioned leakage can be a feature, enabling high accuracy in incomplete tasks without
      sacrificing key properties of concept-based models.

