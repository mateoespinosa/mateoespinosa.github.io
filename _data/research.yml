      me: true
    - name: Pietro Barbiero
      url: https://www.pietrobarbiero.eu
    publication_type: conference
    featured_home: false
    tldr: >-
      Existing concept-based models rely on a single, fixed formula from concepts to task, limiting their
      flexibility across users with different needs and capabilities. M-CBE avoids this by learning a mixture of
      expert models with different functional forms, each of which can be selected by the user at inference time.

