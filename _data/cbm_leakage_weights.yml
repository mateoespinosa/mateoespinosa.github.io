models:

  # ── Model 1: Independent CBM (no leakage) ─────────────────────────────────
  - label: "Ind. CBM (no leakage)"
    color: "#2d5986"

    residual_neurons: 0   # no residual bypass — pure independent CBM
    weight_seed: 42
    weights: ~            # null → JS generates placeholder weights from weight_seed

  # ── Model 2: Hybrid CBM + L_int ───────────────────────────────────────────
  - label: "Hybrid CBM + L_int"
    color: "#27ae60"

    residual_neurons: 10      # unsupervised residual bypass neurons
    max_shown_residuals: 3    # show first 3 and last 3, elide the rest
    weight_seed: 99
    weights: ~                # null → JS generates placeholder weights from weight_seed
